name: Bisection Agent Security

on:
  pull_request:
    paths:
      - "tools/perf_bisection/**"
      - ".github/workflows/bisection-agent-security.yml"
  push:
    branches:
      - develop
    paths:
      - "tools/perf_bisection/**"
      - ".github/workflows/bisection-agent-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4

  dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pypa/gh-action-pip-audit@v1
        with:
          inputs: tools/perf_bisection

  container:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
      - name: Build reconstruction image
        run: |
          docker build \
            --file tools/perf_bisection/docker/Dockerfile \
            --tag isaaclab-bisection-agent:security-scan \
            tools/perf_bisection
      - uses: anchore/scan-action@v7
        with:
          image: isaaclab-bisection-agent:security-scan
          fail-build: true
          severity-cutoff: high
