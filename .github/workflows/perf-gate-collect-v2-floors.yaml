# One-off collection of legacy (previous-IsaacLab-version) hard-floor FPS values.
#
# Purpose: the perf gate's per-task ``fps_mean_floor`` should never sit below the
# FPS a previous shipped IsaacLab version achieved. This workflow runs the legacy
# image's OWN ``scripts/benchmarks/benchmark_non_rl.py`` (the exact benchmark the
# gate uses, not a re-implementation) on the SAME RTX PRO 6000 fleet, then reduces
# its ``Environment step effective FPS`` series the same way the oracle does (mean
# over kept frames) and prints a ready-to-paste ``fps_mean_floor`` block.
#
# Default image: IsaacLab 2.2.0 (Isaac Sim 5.0). This is the OLDEST shipped
# release that runs on the Blackwell fleet — 2.0.x/2.1.x ship PyTorch 2.5.1 with
# no sm_120 kernels and an Isaac Sim 4.5 renderer lacking Blackwell paths, so they
# fail with "no kernel image is available for execution on the device" on RTX PRO
# 6000. 2.2.0 ships torch 2.7.0+cu128 (Blackwell kernels) and the Isaac Sim 5.0
# Blackwell fixes.
#
# This is deliberately manual and NEVER writes anything: it just measures and
# reports. Copy the printed numbers into tasks.json by hand.
#
# IMPORTANT:
#   * The default release is PhysX-era (no Newton backend), so only physx floors
#     come out of this run.
#   * Nothing is mounted into the container except output dirs; the image's own
#     benchmark_non_rl.py + isaaclab install are used (we do NOT overlay current
#     repo source, which would defeat the point).
#   * ``image_ref`` MUST be an image the fleet can pull that the Blackwell GPUs can
#     actually execute (>= IsaacLab 2.2.0 / Isaac Sim 5.0).

name: Performance Gate - Collect Legacy Floors

on:
  # The shared GPU fleet does not grant runners to pull_request events, and a
  # workflow_dispatch workflow is only dispatchable from the default branch. So
  # (mirroring the gate) trigger on push to a dedicated collection branch: pushing
  # the branch is what actually launches this one-off run on the RTX fleet.
  push:
    branches: [neilm/collect-v2-floors]
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Pullable, Blackwell-capable legacy IsaacLab image (>= 2.2.0 / Isaac Sim 5.0). Default is the public minimal 2.2.0 container on NGC."
        required: false
        default: "nvcr.io/nvidia/isaac-lab:2.2.0"
      cells:
        description: >-
          JSON array of cells to measure. Each: {"task","num_envs","num_frames","excluded","cameras"?}.
          'task' is the legacy gym id (may differ from current, e.g. Cartpole is '-v0' here).
        required: false
        default: >-
          [
            {"task":"Isaac-Cartpole-Direct-v0","num_envs":4096,"num_frames":300,"excluded":"0-100"},
            {"task":"Isaac-Factory-GearMesh-Direct-v0","num_envs":512,"num_frames":300,"excluded":"0-100"},
            {"task":"Isaac-Velocity-Flat-G1-v0","num_envs":512,"num_frames":300,"excluded":"0-100"}
          ]
      samples:
        description: "Repetitions per cell (the reported floor is the median of these)."
        required: false
        default: "10"
      seed:
        description: "Environment seed for every run."
        required: false
        default: "42"
      gpu_key:
        description: "tasks.json GPU bucket key the printed block is keyed under."
        required: false
        default: "rtx_pro_6000_blackwell"

concurrency:
  group: perf-gate-collect-v2-floors
  cancel-in-progress: false

permissions:
  contents: read

env:
  NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
  LEGACY_IMAGE_TAG: isaac-lab-legacy:floor-${{ github.run_id }}

jobs:
  collect:
    name: Collect legacy floors
    runs-on: ${{ fromJSON(vars.PERF_GATE_RUNS_ON || '["linux-amd64-gpu-rtxpro6000-latest-1"]') }}
    timeout-minutes: 600

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Pull legacy IsaacLab image
      env:
        # Fall back to the default when push-triggered (inputs.* is empty on push).
        CI_IMAGE_REF: ${{ inputs.image_ref || 'nvcr.io/nvidia/isaac-lab:2.2.0' }}
      run: |
        set -euo pipefail
        if [ -z "${CI_IMAGE_REF}" ]; then
          echo "::error::image_ref is empty (expected a pullable, Blackwell-capable IsaacLab image >= 2.2.0)."
          exit 1
        fi
        # The runner's docker credential store backend is broken ("not implemented"),
        # so disable credsStore before any login (same trick as the gate workflows).
        DOCKER_CONFIG_DIR="$(mktemp -d)"
        echo '{"credsStore":""}' > "${DOCKER_CONFIG_DIR}/config.json"
        export DOCKER_CONFIG="${DOCKER_CONFIG_DIR}"
        REGISTRY="${CI_IMAGE_REF%%/*}"
        if [ "${REGISTRY}" = "nvcr.io" ] && [ -n "${NGC_API_KEY:-}" ]; then
          echo "${NGC_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
        fi
        echo "🔵 Pulling legacy image ${CI_IMAGE_REF}..."
        docker pull "${CI_IMAGE_REF}" || {
          echo "::error::Failed to pull ${CI_IMAGE_REF}. Confirm the fleet's NGC key is entitled to it."
          exit 1
        }
        docker tag "${CI_IMAGE_REF}" "${{ env.LEGACY_IMAGE_TAG }}"
        rm -rf "${DOCKER_CONFIG_DIR}"

    - name: Run 2.2.0 benchmark_non_rl.py per cell
      env:
        # inputs.* are empty on push-triggered runs; fall back to the dispatch defaults.
        CELLS: ${{ inputs.cells }}
        SAMPLES: ${{ inputs.samples || '10' }}
        SEED: ${{ inputs.seed || '42' }}
      run: |
        set -euo pipefail
        # Default cell set when push-triggered (no inputs): the physx cells of the
        # current matrix that exist in the legacy release, using their legacy gym
        # ids (Cartpole is '-v0' in 2.2.0; current gate dropped the suffix).
        if [ -z "${CELLS}" ]; then
          CELLS='[
            {"task":"Isaac-Cartpole-Direct-v0","num_envs":4096,"num_frames":300,"excluded":"0-100"},
            {"task":"Isaac-Factory-GearMesh-Direct-v0","num_envs":512,"num_frames":300,"excluded":"0-100"},
            {"task":"Isaac-Velocity-Flat-G1-v0","num_envs":512,"num_frames":300,"excluded":"0-100"}
          ]'
        fi
        OUT_ROOT="${{ github.workspace }}/legacy-floors"
        mkdir -p "${OUT_ROOT}" "${{ github.workspace }}/kit-cache" "${{ github.workspace }}/jit-cache/warp" "${{ github.workspace }}/jit-cache/nv"
        chmod -R 0777 "${OUT_ROOT}" "${{ github.workspace }}/kit-cache" "${{ github.workspace }}/jit-cache"

        # Iterate the requested cells (jq is preinstalled on the fleet runners).
        echo "${CELLS}" | jq -c '.[]' | while read -r cell; do
          TASK="$(echo "${cell}" | jq -r '.task')"
          NUM_ENVS="$(echo "${cell}" | jq -r '.num_envs')"
          NUM_FRAMES="$(echo "${cell}" | jq -r '.num_frames // 300')"
          EXCLUDED="$(echo "${cell}" | jq -r '.excluded // "0-100"')"
          SAFE_TASK="$(echo "${TASK}" | tr -c 'a-zA-Z0-9' '-')"
          mkdir -p "${OUT_ROOT}/${SAFE_TASK}"
          # Persist the exact gym id + excluded-frame spec so the aggregate step can
          # reproduce the oracle's measured_fps (mean over kept frames).
          echo "${TASK}" > "${OUT_ROOT}/${SAFE_TASK}/task_id.txt"
          echo "${EXCLUDED}" > "${OUT_ROOT}/${SAFE_TASK}/excluded.txt"

          for s in $(seq 1 "${SAMPLES}"); do
            SAMPLE_DIR="${OUT_ROOT}/${SAFE_TASK}/sample_${s}"
            mkdir -p "${SAMPLE_DIR}"; chmod -R 0777 "${SAMPLE_DIR}"
            CONTAINER="legacy-floor-${SAFE_TASK}-${s}-${{ github.run_id }}"
            echo "::group::${TASK} sample ${s}/${SAMPLES}"
            docker rm -f "${CONTAINER}" 2>/dev/null || true
            # Run the image's OWN scripts/benchmarks/benchmark_non_rl.py against its
            # own 2.2.0 install (we do NOT overlay current repo source). physx backend
            # => no presets/hydra args, exactly matching the gate's physx launch path.
            docker run --rm --name "${CONTAINER}" \
              --init --stop-timeout 10 --entrypoint bash \
              --gpus all --network=host \
              --security-opt=no-new-privileges:true \
              --ulimit nofile=65536:65536 --ulimit nproc=4096:4096 \
              -e OMNI_KIT_ACCEPT_EULA=yes -e ACCEPT_EULA=Y \
              -e OMNI_KIT_DISABLE_CUP=1 -e ISAAC_SIM_HEADLESS=1 \
              -e PYTHONUNBUFFERED=1 -e PYTHONDONTWRITEBYTECODE=1 \
              -e WARP_CACHE_PATH=/tmp/jit-cache/warp -e CUDA_CACHE_PATH=/tmp/jit-cache/nv \
              -v "${SAMPLE_DIR}:/tmp/floor_out" \
              -v "${{ github.workspace }}/jit-cache:/tmp/jit-cache" \
              -v "${{ github.workspace }}/kit-cache:/isaac-sim/kit/cache" \
              "${{ env.LEGACY_IMAGE_TAG }}" \
              -c "
                set -e
                ISAACLAB_ROOT=''
                for d in /workspace/isaaclab /workspace/IsaacLab /root/IsaacLab /isaac-lab; do
                  if [ -x \"\$d/isaaclab.sh\" ]; then ISAACLAB_ROOT=\"\$d\"; break; fi
                done
                if [ -z \"\$ISAACLAB_ROOT\" ]; then
                  echo 'could not locate isaaclab.sh in the legacy image'; exit 1
                fi
                cd \"\$ISAACLAB_ROOT\"
                rm -f _isaac_sim
                ln -s /isaac-sim _isaac_sim
                touch /tmp/.benchstart
                # The 2.2.0 script has no --output_path arg; its JSONFileMetrics backend
                # writes to a services-chosen path. Run it, then grab the freshest json
                # that actually contains the effective-FPS series.
                set +e
                ./isaaclab.sh -p scripts/benchmarks/benchmark_non_rl.py \
                  --task '${TASK}' \
                  --num_envs ${NUM_ENVS} \
                  --num_frames ${NUM_FRAMES} \
                  --benchmark_backend JSONFileMetrics \
                  --seed ${SEED} \
                  --headless
                RC=\$?
                set -e
                OUT_JSON=\"\$(find \"\$ISAACLAB_ROOT\" /tmp /root -type f -name '*.json' -newer /tmp/.benchstart 2>/dev/null | xargs -r grep -l 'Environment step effective FPS' 2>/dev/null | head -1)\"
                if [ -n \"\$OUT_JSON\" ]; then
                  cp \"\$OUT_JSON\" /tmp/floor_out/benchmark_output.json
                  echo \"collected \$OUT_JSON (benchmark rc=\$RC)\"
                else
                  echo \"::warning::no benchmark json with FPS series found (rc=\$RC)\"
                fi
              " 2>&1 | tee "${SAMPLE_DIR}/run.log" || echo "::warning::${TASK} sample ${s} failed (see log)"
            echo "::endgroup::"
          done
        done

    - name: Aggregate floors (median of samples) and print tasks.json block
      if: always()
      env:
        GPU_KEY: ${{ inputs.gpu_key || 'rtx_pro_6000_blackwell' }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, statistics
        from pathlib import Path

        out_root = Path(os.environ["GITHUB_WORKSPACE"]) / "legacy-floors"
        gpu_key = os.environ.get("GPU_KEY", "rtx_pro_6000_blackwell")
        summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

        def expand_excluded(spec: str) -> set[int]:
            idx: set[int] = set()
            for tok in (spec or "").split():
                tok = tok.strip()
                if not tok:
                    continue
                if "-" in tok:
                    lo, hi = tok.split("-", 1)
                    idx.update(range(int(lo), int(hi) + 1))  # inclusive, matches oracle
                else:
                    idx.add(int(tok))
            return idx

        def find_series(obj):
            """Recursively locate the 'Environment step effective FPS' list anywhere."""
            if isinstance(obj, dict):
                for k, v in obj.items():
                    if k == "Environment step effective FPS" and isinstance(v, list):
                        return v
                    r = find_series(v)
                    if r is not None:
                        return r
            elif isinstance(obj, list):
                for it in obj:
                    r = find_series(it)
                    if r is not None:
                        return r
            return None

        def sample_fps(path: Path, excluded: set[int]) -> float | None:
            series = find_series(json.loads(path.read_text()))
            if not series:
                return None
            kept = [float(f) for i, f in enumerate(series)
                    if i not in excluded and isinstance(f, (int, float)) and not isinstance(f, bool)]
            return statistics.mean(kept) if len(kept) >= 2 else None

        rows = []
        per_task_floor = {}
        for task_dir in sorted(p for p in out_root.glob("*") if p.is_dir()):
            excl_file = task_dir / "excluded.txt"
            excluded = expand_excluded(excl_file.read_text().strip() if excl_file.exists() else "0-100")
            tid_file = task_dir / "task_id.txt"
            task_id = tid_file.read_text().strip() if tid_file.exists() else task_dir.name
            samples = []
            for jf in sorted(task_dir.glob("sample_*/benchmark_output.json")):
                try:
                    v = sample_fps(jf, excluded)
                    if v and v > 0:
                        samples.append(v)
                except Exception:
                    pass
            if not samples:
                rows.append((task_id, "N/A", 0, "no usable samples"))
                continue
            med = statistics.median(samples)
            per_task_floor[task_id] = med
            rows.append((task_id, f"{med:.1f}", len(samples), ", ".join(f"{s:.0f}" for s in samples)))

        lines = ["## Legacy IsaacLab hard-floor collection (benchmark_non_rl.py)", "",
                 "Metric: mean of `Environment step effective FPS` over kept frames "
                 "(warmup frames dropped), reproducing the oracle's `measured_fps`.", "",
                 "| Task | Median FPS | Samples | Per-sample FPS |", "|---|---:|---:|---|"]
        for task, med, n, detail in rows:
            lines.append(f"| {task} | {med} | {n} | {detail} |")
        lines += ["", "Suggested `fps_mean_floor` entries (physx, no margin):", "",
                  "```json",
                  json.dumps({gpu_key: {t: round(v, 1) for t, v in per_task_floor.items()}}, indent=2),
                  "```",
                  "",
                  "_The legacy release is PhysX-era, so no newton floors are produced. "
                  "2.2.0 registers Cartpole as `Isaac-Cartpole-Direct-v0`; the current gate "
                  "uses `Isaac-Cartpole-Direct` (no suffix)._"]
        text = "\n".join(lines)
        print(text)
        with summary.open("a") as fh:
            fh.write(text + "\n")
        PY

    - name: Upload legacy floor artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: legacy-floors-${{ github.run_id }}
        path: legacy-floors/
        retention-days: 7
        if-no-files-found: warn
