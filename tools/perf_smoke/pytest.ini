; Local pytest config for the perf-smoke gate.
;
; Its mere presence pins the rootdir to tools/perf_smoke/, which keeps the parent
; tools/conftest.py harness (it hijacks every pytest session under tools/) from
; loading. That lets the gate run as an ordinary pytest module that shells out
; each Isaac Sim run as its own subprocess (D1), exactly the model the doc asks
; for, without disturbing the repo-wide test harness.
[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra
